<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>The Traffic Stop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <style>
    html, body, #renderCanvas { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0a0a12; }
    #ui {
      position:absolute; bottom:0; left:0; right:0;
      padding:20px 32px 28px;
      background:linear-gradient(transparent, rgba(0,0,0,.75));
      font-family:Georgia, serif; color:#fff; pointer-events:none;
    }
    #speaker { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-bottom:6px; }
    #line    { font-size:17px; line-height:1.5; max-width:640px; margin:0 auto; text-align:center;
               text-shadow:0 1px 6px rgba(0,0,0,.8); min-height:1.5em; }
    #prog-bg { height:2px; background:rgba(255,255,255,.15); border-radius:1px; margin-top:14px; }
    #prog-bar{ height:100%; background:rgba(180,200,255,.7); border-radius:1px; width:0%; transition:width .1s linear; }
    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
               font:14px monospace; color:rgba(255,255,255,.5); background:#0a0a12; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div id="speaker"></div>
    <div id="line">Loading…</div>
    <div id="prog-bg"><div id="prog-bar"></div></div>
  </div>
  <div id="loading">Loading scene…</div>

  <script type="module">
    BABYLON.TransformNode.prototype.getTotalVertices ??= () => 0;

    const speakerEl = document.getElementById('speaker');
    const lineEl    = document.getElementById('line');
    const progEl    = document.getElementById('prog-bar');
    const loadEl    = document.getElementById('loading');

    const resolveAsset = p => (p && !p.startsWith('http')) ? '../' + p : p;
    const resolveClipDef = def => {
      if (!def) return null;
      if (typeof def === 'string') return { url: resolveAsset(def) };
      return { url: resolveAsset(def.url), from: def.from, to: def.to };
    };
    const resolveVRM = p => {
      if (p.startsWith('http')) return p;
      if (p.startsWith('models/')) return '../' + p;
      return p;
    };

    const ARKIT_MAP = {
      'jawOpen': 'aa', 'mouthFunnel': 'oh', 'mouthPucker': 'ou',
      'eyeBlinkLeft': 'blinkLeft', 'eyeBlinkRight': 'blinkRight',
      'mouthSmileLeft': 'happy', 'mouthSmileRight': 'happy'
    };

    function evalExprChannel(ch, t) {
      const { times, weights } = ch;
      if (t <= times[0]) return weights[0];
      if (t >= times[times.length - 1]) return weights[weights.length - 1];
      for (let i = 1; i < times.length; i++) {
        if (t <= times[i]) {
          const u = (t - times[i - 1]) / (times[i] - times[i - 1]);
          return weights[i - 1] * (1 - u) + weights[i] * u;
        }
      }
      return weights[weights.length - 1];
    }

    async function loadFaceJSON(url) {
      if (!url || url.endsWith('.vrma') || url.endsWith('.vrm')) return null;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const { names, frames } = data;
        if (!names?.length || !frames?.length) return null;
        const times = frames.map(f => f.time);
        return {
          names, duration: times[times.length - 1] ?? 0,
          channels: names.map((name, i) => ({
            name, times, weights: frames.map(f => f.weights[i] ?? 0)
          })),
          startT: null
        };
      } catch (e) { return null; }
    }

    // ── Load resources in parallel ─────────────────────────────────────────────
    const [, sceneData] = await Promise.all([
      new Promise((res, rej) => {
        window.LOADERS = BABYLON;
        const s = document.createElement('script');
        s.src = 'https://xuhuisheng.github.io/babylonjs-vrm/babylon-vrm-loader.js';
        s.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'vrm1-loader.js';
          s2.onload = res;
          s2.onerror = () => { console.warn('[scene] vrm1-loader missing'); res(); };
          document.head.appendChild(s2);
        };
        s.onerror = rej;
        document.head.appendChild(s);
      }),
      fetch('traffic_scene.json').then(r => r.json()),
    ]);

    // ── Babylon scene ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene  = new BABYLON.Scene(engine);

    scene.ambientColor = new BABYLON.Color3(.05, .05, .1);
    scene.clearColor   = new BABYLON.Color4(.04, .04, .08, 1);

    const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(.3, -1, .5), scene);
    key.intensity = 1.2;
    key.diffuse   = new BABYLON.Color3(1, .95, .85);
    const fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0, 1, 0), scene);
    fill.intensity = .35;
    fill.diffuse   = new BABYLON.Color3(.6, .7, 1);
    fill.groundColor = new BABYLON.Color3(.05, .04, .08);

    const camera = new BABYLON.ArcRotateCamera('cam',
      Math.PI / 2, Math.PI / 2 - 0.22, 4.2,
      new BABYLON.Vector3(0, 1.05, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 1; camera.upperRadiusLimit = 12;

    // ── Actor loader ───────────────────────────────────────────────────────────
    const actors = {};

    async function loadActor(actorDef) {
      const { id, vrm, startPosition, idleClip } = actorDef;
      loadEl.textContent = `Loading ${id}…`;
      const preMgrCount = scene.metadata?.vrmManagers?.length ?? 0;
      const preRootIds  = new Set(scene.rootNodes.map(n => n.uniqueId));

      await BABYLON.ImportMeshAsync(resolveVRM(vrm), scene);

      const mgr = scene.metadata?.vrmManagers?.[preMgrCount];
      const root = scene.rootNodes.find(n => !preRootIds.has(n.uniqueId));
      if (!mgr || !root) { console.error('[scene] Load failed for', id); return; }

      root.position.set(startPosition?.x ?? 0, startPosition?.y ?? 0, startPosition?.z ?? 0);

      const vrmAvatar = new BABYLON.AnimatorAvatar(`avatar-${id}`, root);

      // Build morph target map (ARKit blendshapes)
      const morphMap = new Map();
      const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const mesh of root.getChildMeshes(false)) {
        const mtm = mesh.morphTargetManager;
        if (!mtm) continue;
        for (let i = 0; i < mtm.numTargets; i++) {
          const mt = mtm.getTarget(i);
          if (!mt.name) continue;
          morphMap.set(mt.name.toLowerCase(), mt);
          morphMap.set(normalize(mt.name), mt);
          mt.name.split(/[._]/).forEach(p => {
            if (p) { morphMap.set(p.toLowerCase(), mt); morphMap.set(normalize(p), mt); }
          });
        }
      }

      actors[id] = { id, mgr, root, vrmAvatar, morphMap, faceAnim: null, idleGroup: null, gestureGroup: null };

      if (idleClip) {
        const clip = resolveClipDef(idleClip);
        if (!clip) return;
        const g = await loadAndRetargetVRMA(actors[id], clip.url, 'idle', { fixRootPosition: true });
        if (g) {
          actors[id].idleGroup = g;
          const from = clip.from ?? g.from;
          const to = clip.to ?? g.to;
          g.start(false, 1.0, from, to, true);
        }
      }
    }

    // ── VRMA body animation ────────────────────────────────────────────────────
    const UPPER_BODY = new Set([
      'Spine1', 'Spine2', 'Neck', 'Head',
      'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand',
      'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand',
    ]);

    function filterUpperBody(group, newName) {
      const upper = new BABYLON.AnimationGroup(newName, scene);
      for (const ta of group.targetedAnimations) {
        if (ta.target && UPPER_BODY.has(ta.target.name)) {
          upper.addTargetedAnimation(ta.animation, ta.target);
        }
      }
      group.dispose();
      return upper;
    }

    async function loadAndRetargetVRMA(actor, url, name, opts = {}) {
      const { fixRootPosition = true } = opts;
      const managersBefore = (scene.metadata?.vrmAnimationManagers ?? []).length;
      let container;
      try { container = await BABYLON.LoadAssetContainerAsync(url, scene); }
      catch (e) { console.warn('[scene] VRMA load failed:', url, e); return null; }

      const vrmAnimMgr = (scene.metadata?.vrmAnimationManagers ?? [])[managersBefore];
      const srcGroup = container.animationGroups[0];

      if (!vrmAnimMgr?.animationMap || !srcGroup) {
        container.dispose();
        return null;
      }

      const mapNodeNames = new Map();
      srcGroup.targetedAnimations.forEach((ta, i) => {
        const boneName = vrmAnimMgr.animationMap.get(i);
        const bone = actor.mgr.humanoidBone[boneName];
        if (bone && ta.target?.name) {
          mapNodeNames.set(ta.target.name, bone.name);
        }
      });

      const remapped = actor.vrmAvatar.retargetAnimationGroup(srcGroup, {
        animationGroupName: `${actor.id}-${name}`,
        fixAnimations: true,
        fixRootPosition,
        rootNodeName: actor.mgr.humanoidBone['hips']?.name,
        groundReferenceNodeName: actor.mgr.humanoidBone['leftFoot']?.name,
        mapNodeNames,
      });

      container.dispose();
      return remapped;
    }

    function stopGesture(actor) {
      if (actor.gestureGroup) {
        actor.gestureGroup.stop();
        actor.gestureGroup.dispose();
        actor.gestureGroup = null;
      }
    }

    // ── Face animation (morph targets from audio2expression JSON) ─────────────
    function setExpression(actor, name, value) {
      const targetKey = name.toLowerCase();
      const normalizedKey = targetKey.replace(/[^a-z0-9]/g, '');
      let mt = actor.morphMap.get(targetKey) || actor.morphMap.get(normalizedKey);
      if (!mt) {
        const mapped = ARKIT_MAP[name];
        if (mapped) {
          const mk = mapped.toLowerCase();
          mt = actor.morphMap.get(mk) || actor.morphMap.get(mk.replace(/[^a-z0-9]/g, ''));
        }
      }
      if (mt) mt.influence = value;
    }

    function resetFace(actor) {
      if (!actor?.faceAnim) return;
      for (const ch of actor.faceAnim.channels) setExpression(actor, ch.name, 0);
      actor.faceAnim = null;
    }

    // ── Render-loop face evaluation ───────────────────────────────────────────
    scene.onBeforeRenderObservable.add(() => {
      const now = performance.now() / 1000;
      for (const actor of Object.values(actors)) {
        const fa = actor.faceAnim;
        if (!fa?.startT) continue;
        const t = now - fa.startT;
        if (t > fa.duration + 0.1) {
          for (const ch of fa.channels) setExpression(actor, ch.name, 0);
          actor.faceAnim = null;
        } else {
          for (const ch of fa.channels) {
            setExpression(actor, ch.name, evalExprChannel(ch, t));
          }
        }
      }
    });

    // ── Timeline event player ──────────────────────────────────────────────────
    async function playEvent(event) {
      const actor = actors[event.actor];
      if (!actor) return;

      speakerEl.textContent = event.actor.toUpperCase();
      lineEl.textContent    = event.description ?? '';

      stopGesture(actor);
      resetFace(actor);

      const targetX = actor.root.position.x * 0.4;
      camera.setTarget(BABYLON.Vector3.Lerp(camera.target, new BABYLON.Vector3(targetX, 1.05, 0), 0.6));

      // Load body VRMA as upper-body gesture on top of looping idle
      const clipUrl = event.clip || event.layers?.BODY;
      if (clipUrl) {
        const g = await loadAndRetargetVRMA(actor, resolveAsset(clipUrl), 'gesture', { fixRootPosition: false });
        if (g) {
          const filtered = filterUpperBody(g, `${actor.id}-gesture`);
          actor.gestureGroup = filtered;
          if (filtered.targetedAnimations.length > 0) {
            filtered.start(false, 1.0, filtered.from, filtered.to, false);
          }
        }
      }

      // Load face animation (audio2expression JSON)
      const faceURL = resolveAsset(event.lipSync || event.layers?.FACE);
      const fa = await loadFaceJSON(faceURL);
      if (fa) {
        fa.startT = performance.now() / 1000;
        actor.faceAnim = fa;
      }

      if (event.audio) {
        const audio = new Audio(resolveAsset(event.audio));

        let progObs = scene.onBeforeRenderObservable.add(() => {
          const t = audio.duration > 0 ? audio.currentTime / audio.duration : 0;
          progEl.style.width = (t * 100).toFixed(1) + '%';
        });

        await new Promise(resolve => {
          audio.onended = () => { scene.onBeforeRenderObservable.remove(progObs); resolve(); };
          audio.onerror = () => { scene.onBeforeRenderObservable.remove(progObs); resolve(); };
          audio.play().catch(resolve);
        });
      } else {
        const dur = event.duration ?? 4;
        const start = performance.now();
        await new Promise(resolve => {
          let obs = scene.onBeforeRenderObservable.add(() => {
            const t = Math.min((performance.now() - start) / (dur * 1000), 1);
            progEl.style.width = (t * 100).toFixed(1) + '%';
            if (t >= 1) { scene.onBeforeRenderObservable.remove(obs); resolve(); }
          });
        });
      }

      resetFace(actor);
      stopGesture(actor);
      progEl.style.width = '0%';
    }

    async function runScene() {
      const timeline = sceneData.timeline ?? [];
      for (let i = 0; i < timeline.length; i++) {
        await playEvent(timeline[i]);
        await new Promise(r => setTimeout(r, 400));
      }
      speakerEl.textContent = '';
      lineEl.textContent    = '— end —';
    }

    for (const actorDef of (sceneData.actors ?? [])) {
      await loadActor(actorDef);
    }

    loadEl.style.display = 'none';
    lineEl.textContent   = 'Click to begin';
    speakerEl.textContent = '';

    await new Promise(resolve => canvas.addEventListener('click', resolve, { once: true }));
    lineEl.textContent = '';

    engine.runRenderLoop(() => { scene.render(); });
    window.addEventListener('resize', () => engine.resize());
    runScene();
  </script>
</body>
</html>
