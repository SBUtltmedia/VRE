<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>The Traffic Stop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <style>
    html, body, #renderCanvas { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0a0a12; }
    #ui {
      position:absolute; bottom:0; left:0; right:0;
      padding:20px 32px 28px;
      background:linear-gradient(transparent, rgba(0,0,0,.75));
      font-family:Georgia, serif; color:#fff; pointer-events:none;
    }
    #speaker { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-bottom:6px; }
    #line    { font-size:17px; line-height:1.5; max-width:640px; margin:0 auto; text-align:center;
               text-shadow:0 1px 6px rgba(0,0,0,.8); min-height:1.5em; }
    #prog-bg { height:2px; background:rgba(255,255,255,.15); border-radius:1px; margin-top:14px; }
    #prog-bar{ height:100%; background:rgba(180,200,255,.7); border-radius:1px; width:0%; transition:width .1s linear; }
    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
               font:14px monospace; color:rgba(255,255,255,.5); background:#0a0a12; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div id="speaker"></div>
    <div id="line">Loading…</div>
    <div id="prog-bg"><div id="prog-bar"></div></div>
  </div>
  <div id="loading">Loading scene…</div>
  <div id="diagnostics" style="position:absolute; top:10px; left:10px; padding:10px; background:rgba(0,0,0,0.6); color:#0f0; font:10px monospace; pointer-events:none; border-radius:4px; display:none;">
    <div style="font-weight:bold; margin-bottom:4px;">BONE MONITOR</div>
    <div id="bone-list"></div>
  </div>

  <script type="module">
    import { TransitionGenerator } from "./js/TransitionGenerator.js";

    window.onerror = (msg, url, line, col, error) => {
      document.body.setAttribute('data-status', 'error');
      document.body.setAttribute('data-error', msg);
      console.error('[CRITICAL ERROR]', msg, error);
      return false;
    };

    BABYLON.TransformNode.prototype.getTotalVertices ??= () => 0;

    const speakerEl = document.getElementById('speaker');
    const lineEl    = document.getElementById('line');
    const progEl    = document.getElementById('prog-bar');
    const loadEl    = document.getElementById('loading');

    const resolveAsset = p => (p && !p.startsWith('http')) ? '../' + p : p;
    const resolveClipDef = def => {
      if (!def) return null;
      if (typeof def === 'string') return { url: resolveAsset(def) };
      return { url: resolveAsset(def.url), from: def.from, to: def.to };
    };
    const resolveVRM = p => {
      if (p.startsWith('http')) return p;
      if (p.startsWith('models/')) return '../' + p;
      return p;
    };

    const isTest = new URLSearchParams(location.search).has('test');
    const TEST_BONE_MOVEMENT_THRESHOLD = 0.02; // degrees — min bone rotation delta to consider animations playing

    const ARKIT_MAP = {
      'jawOpen': 'aa', 'mouthFunnel': 'oh', 'mouthPucker': 'ou',
      'eyeBlinkLeft': 'blinkLeft', 'eyeBlinkRight': 'blinkRight',
      'mouthSmileLeft': 'happy', 'mouthSmileRight': 'happy'
    };

    function evalExprChannel(ch, t) {
      const { times, weights } = ch;
      if (t <= times[0]) return weights[0];
      if (t >= times[times.length - 1]) return weights[weights.length - 1];
      for (let i = 1; i < times.length; i++) {
        if (t <= times[i]) {
          const u = (t - times[i - 1]) / (times[i] - times[i - 1]);
          return weights[i - 1] * (1 - u) + weights[i] * u;
        }
      }
      return weights[weights.length - 1];
    }

    async function loadFaceJSON(url) {
      if (!url || url.endsWith('.vrma') || url.endsWith('.vrm')) return null;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const { names, frames } = data;
        if (!names?.length || !frames?.length) return null;
        const times = frames.map(f => f.time);
        return {
          names, duration: times[times.length - 1] ?? 0,
          channels: names.map((name, i) => ({
            name, times, weights: frames.map(f => f.weights[i] ?? 0)
          })),
          startT: null
        };
      } catch (e) { return null; }
    }

    // ── Load resources in parallel ─────────────────────────────────────────────
    const [, sceneData] = await Promise.all([
      new Promise((res, rej) => {
        window.LOADERS = BABYLON;
        const s = document.createElement('script');
        s.src = 'https://xuhuisheng.github.io/babylonjs-vrm/babylon-vrm-loader.js';
        s.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'vrm1-loader.js';
          s2.onload = res;
          s2.onerror = () => { console.warn('[scene] vrm1-loader missing'); res(); };
          document.head.appendChild(s2);
        };
        s.onerror = rej;
        document.head.appendChild(s);
      }),
      fetch('traffic_scene.json').then(r => r.json()),
    ]);

    // ── Babylon scene ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene  = new BABYLON.Scene(engine);

    scene.ambientColor = new BABYLON.Color3(.05, .05, .1);
    scene.clearColor   = new BABYLON.Color4(.04, .04, .08, 1);

    const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(.3, -1, .5), scene);
    key.intensity = 1.2;
    key.diffuse   = new BABYLON.Color3(1, .95, .85);
    const fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0, 1, 0), scene);
    fill.intensity = .35;
    fill.diffuse   = new BABYLON.Color3(.6, .7, 1);
    fill.groundColor = new BABYLON.Color3(.05, .04, .08);

    const camera = new BABYLON.ArcRotateCamera('cam',
      Math.PI / 2, Math.PI / 2 - 0.22, 4.2,
      new BABYLON.Vector3(0, 1.05, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 1; camera.upperRadiusLimit = 12;

    // ── Actor loader ───────────────────────────────────────────────────────────
    const actors = {};

    async function loadActor(actorDef) {
      const { id, vrm, startPosition, idleClip } = actorDef;
      loadEl.textContent = `Loading ${id}…`;
      const preMgrCount = scene.metadata?.vrmManagers?.length ?? 0;
      const preRootIds  = new Set(scene.rootNodes.map(n => n.uniqueId));

      await BABYLON.ImportMeshAsync(resolveVRM(vrm), scene);

      const mgr = (scene.metadata?.vrmManagers ?? [])
        .slice(preMgrCount).find(m => m.isVRM1)
        ?? scene.metadata?.vrmManagers?.[preMgrCount];
      const root = scene.rootNodes.find(n => !preRootIds.has(n.uniqueId));
      if (!mgr || !root) { console.error('[scene] Load failed for', id); return; }

      root.position.set(startPosition?.x ?? 0, startPosition?.y ?? 0, startPosition?.z ?? 0);

      const vrmAvatar = new BABYLON.AnimatorAvatar(`avatar-${id}`, root);

      // Build morph target map (ARKit blendshapes)
      const morphMap = new Map();
      const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const mesh of root.getChildMeshes(false)) {
        const mtm = mesh.morphTargetManager;
        if (!mtm) continue;
        for (let i = 0; i < mtm.numTargets; i++) {
          const mt = mtm.getTarget(i);
          if (!mt.name) continue;
          morphMap.set(mt.name.toLowerCase(), mt);
          morphMap.set(normalize(mt.name), mt);
          mt.name.split(/[._]/).forEach(p => {
            if (p) { morphMap.set(p.toLowerCase(), mt); morphMap.set(normalize(p), mt); }
          });
        }
      }

      actors[id] = { id, mgr, root, vrmAvatar, morphMap, faceAnim: null, idleGroup: null, gestureGroup: null };

        if (idleClip) {
          const clip = resolveClipDef(idleClip);
          if (!clip) return;
          const g = await loadAndRetargetVRMA(actors[id], clip.url, 'idle', { fixRootPosition: false });
          if (g) {
            actors[id].idleGroup = g;
            g._idleFrom = clip.from != null ? clip.from : g.from;
            g._idleTo = clip.to != null ? clip.to : g.to;
            // Defer start to first render frame (avoids 0 animatables when engine not running)
            scene.onBeforeRenderObservable.addOnce(() => {
              g.start(true, 1.0, g._idleFrom, g._idleTo, false);
            });
          }
      }
    }

    // Expose for puppeteer diagnostics
    window.__scene = scene;
    window.__actors = actors;

    // ── VRMA body animation ────────────────────────────────────────────────────
    function cloneRetargetedGroup(group, newName) {
      const cloned = new BABYLON.AnimationGroup(newName, scene);
      for (const ta of group.targetedAnimations) {
        if (ta.target) {
          const anim = ta.animation;
          anim.fillMode = BABYLON.Animation.FILLMODE_HOLD;
          cloned.addTargetedAnimation(anim, ta.target);
        }
      }
      group.stop();
      return cloned;
    }

    async function loadAndRetargetVRMA(actor, url, name, opts = {}) {
      const { fixRootPosition = false } = opts;
      let container;
      try { container = await BABYLON.LoadAssetContainerAsync(url, scene); }
      catch (e) { console.warn('[scene] VRMA load failed:', url, e); return null; }

      const srcGroup = container.animationGroups[0];
      const vrmAnimMgr = (scene.metadata?._vrmAnimations ?? []).at(-1);

      if (!vrmAnimMgr?.animationMap || !srcGroup) {
        container.dispose();
        return null;
      }

      const mapNodeNames = new Map();
      srcGroup.targetedAnimations.forEach((ta, i) => {
        const boneName = vrmAnimMgr.animationMap.get(i);
        const bone = actor.mgr.humanoidBone[boneName];
        if (bone && ta.target?.name) {
          mapNodeNames.set(ta.target.name, bone.name);
        }
      });

      const remapped = actor.vrmAvatar.retargetAnimationGroup(srcGroup, {
        animationGroupName: `${actor.id}-${name}`,
        fixAnimations: false,
        fixRootPosition,
        rootNodeName: actor.mgr.humanoidBone['hips']?.name,
        groundReferenceNodeName: actor.mgr.humanoidBone['leftFoot']?.name,
        mapNodeNames,
      });

      container.dispose();
      return remapped;
    }

    function stopGesture(actor) {
      if (actor.gestureGroup) {
        // Move to a temporary property to fade out
        const oldGesture = actor.gestureGroup;
        actor.fadingGestures ??= [];
        actor.fadingGestures.push(oldGesture);
        actor.gestureGroup = null;
      }
    }

    // ── Face animation (morph targets from audio2expression JSON) ─────────────
    function setExpression(actor, name, value) {
      const targetKey = name.toLowerCase();
      const normalizedKey = targetKey.replace(/[^a-z0-9]/g, '');
      let mt = actor.morphMap.get(targetKey) || actor.morphMap.get(normalizedKey);
      if (!mt) {
        const mapped = ARKIT_MAP[name];
        if (mapped) {
          const mk = mapped.toLowerCase();
          mt = actor.morphMap.get(mk) || actor.morphMap.get(mk.replace(/[^a-z0-9]/g, ''));
        }
      }
      if (mt) mt.influence = value;
    }

    function resetFace(actor) {
      if (!actor?.faceAnim) return;
      for (const ch of actor.faceAnim.channels) setExpression(actor, ch.name, 0);
      actor.faceAnim = null;
    }

    const boneListEl = document.getElementById('bone-list');
    const diagEl = document.getElementById('diagnostics');
    const TRACKED_BONES_DEFAULT = ['spine', 'chest', 'upperChest', 'neck', 'leftUpperArm', 'rightUpperArm'];
    let TRACKED_BONES = [...TRACKED_BONES_DEFAULT];

    const urlParams = new URLSearchParams(location.search);
    const GESTURE_FADE = parseFloat(urlParams.get('fade')) || 0.5;
    const SNAP_DETECTION_THRESHOLD = parseFloat(urlParams.get('snap')) || 10.0;
    const TRANSITION_MODE = urlParams.get('transition') || 'vrma';
    const USE_VRMA_TRANSITION = TRANSITION_MODE === 'vrma';
    const USE_WEIGHT_TRANSITION = TRANSITION_MODE === 'weight';
    const USE_INERTIAL = TRANSITION_MODE === 'inertial';
    const USE_MATCH_CROSSFADE = TRANSITION_MODE === 'match';
    const TX_FRAMES = parseInt(urlParams.get('txframes')) || 0;
    const MIN_TX_FRAMES = 12; 
    const SMOOTH_THRESHOLD_DEG = parseFloat(urlParams.get('smooth')) || 6; 
    const TARGET_DEG_PER_FRAME = Math.max(0.5, SMOOTH_THRESHOLD_DEG / 4); 
    const MAX_TX_FRAMES = TX_FRAMES > 0 ? TX_FRAMES : (parseInt(urlParams.get('maxtx')) || 120); 
    const smoothstep = (t) => t * t * (3 - 2 * t);
    const FINGER_BONE_RE = /thumb|index|middle|ring|little|metacarpal|finger/i;
    function getLimbNodeNames() {
      const names = new Set();
      for (const actor of Object.values(actors)) {
        if (!actor.mgr?.humanoidBone) continue;
        for (const [key, bone] of Object.entries(actor.mgr.humanoidBone)) {
          if (key === 'nodeMap') continue;
          if (!bone?.name || FINGER_BONE_RE.test(key)) continue;
          names.add(bone.name);
        }
      }
      return names;
    }

    // ── Render-loop evaluation (Face, Gestures, Diagnostics) ──────────────────
    scene.onBeforeRenderObservable.add(() => {
      const now = performance.now() / 1000;
      const dt = engine.getDeltaTime() / 1000;
      let diagHtml = '';

      for (const actor of Object.values(actors)) {
        // 1. Face Animation
        const fa = actor.faceAnim;
        if (fa?.startT) {
          const t = now - fa.startT;
          if (t > fa.duration + 0.1) {
            for (const ch of fa.channels) setExpression(actor, ch.name, 0);
            actor.faceAnim = null;
          } else {
            for (const ch of fa.channels) setExpression(actor, ch.name, evalExprChannel(ch, t));
          }
        }

        // 2. Gesture Control: entry transitions + exit fade-out
        if (actor.gestureGroup) {
          const g = actor.gestureGroup;
          if (g._startTime === undefined) g._startTime = now;
          const elapsed = now - g._startTime;

          // EXIT FADE-OUT (ALL MODES): gesture stop triggers weight ramp to 0
          if (g._isStopping) {
            if (g._stopTime === undefined) g._stopTime = now;
            const stopElapsed = now - g._stopTime;
            const targetW = smoothstep(Math.max(0, 1 - (stopElapsed / GESTURE_FADE)));
            if (typeof g.weight === 'number') g.weight = targetW;
            if (targetW <= 0) {
              g.stop(); g.dispose(); actor.gestureGroup = null;
            }
          } else if (actor._usingVRMATransition) {
            g.weight = 0;
          } else if (actor._usingInertialTransition) {
            g.weight = 0;
            const ib = actor._inertialBlend;
            if (!ib?.isActive) {
              g.weight = 1;
              actor._usingInertialTransition = false;
              if (!g.isPlaying) {
                g.start(false, 1.0, actor._inertialEntryFrame ?? 0, g.to, false);
                g.goToFrame(actor._inertialEntryFrame ?? 0);
              }
            }
          } else if (USE_MATCH_CROSSFADE) {
            g.weight = smoothstep(Math.min(elapsed / GESTURE_FADE, 1));
          } else if (USE_WEIGHT_TRANSITION) {
            const targetW = elapsed < GESTURE_FADE
              ? smoothstep(elapsed / GESTURE_FADE)
              : 1;
            if (actor.gestureGroup) g.weight = targetW;
          }
        }

        // Fade out old gestures
        if (actor.fadingGestures) {
          for (let i = actor.fadingGestures.length - 1; i >= 0; i--) {
            const g = actor.fadingGestures[i];
            if (!g._fadeOutStart) g._fadeOutStart = now;
            const elapsed = now - g._fadeOutStart;
            const w = smoothstep(Math.max(0, 1 - (elapsed / GESTURE_FADE)));
            g.weight = w;
            if (w <= 0) {
              g.stop(); g.dispose();
              actor.fadingGestures.splice(i, 1);
            }
          }
        }

        // 3. Diagnostics & Snap Detection (Measures pose from PREVIOUS frame)
        const isCurrentlyAnimating = actor.faceAnim || actor.gestureGroup || (actor.fadingGestures && actor.fadingGestures.length > 0) || actor._usingVRMATransition || (isTest && actor._testTransitionData?._fadeOutStart != null);
        
        if (actor._loading) {
          actor.lastRotations = {};
        }

        if (isCurrentlyAnimating && !actor._loading) {
          diagHtml += `<div style="color:#fff; text-decoration:underline;">Actor: ${actor.id}</div>`;
          actor.lastRotations ??= {};
          actor.physicalViolations ??= [];

          const currentRots = {};
          for (const boneName of TRACKED_BONES) {
            const bone = actor.mgr.humanoidBone[boneName];
            if (bone) {
              const q = bone.rotationQuaternion || BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z);
              const rot = q.toEulerAngles();
              const deg = rot.scale(180/Math.PI);
              currentRots[boneName] = q.clone();
              
              if (actor.lastRotations[boneName]) {
                const lastQ = actor.lastRotations[boneName];
                const dot = Math.abs(lastQ.x * q.x + lastQ.y * q.y + lastQ.z * q.z + lastQ.w * q.w);
                const angle = 2 * Math.acos(Math.min(1, dot)) * (180/Math.PI);
                
                const isFirstFrame = actor.gestureGroup && (now - actor.gestureGroup._startTime < 0.1);

                if (angle > SNAP_DETECTION_THRESHOLD && !isFirstFrame) {
                  // Determine phase (fadeIn / steady / fadeOut)
                  const td = actor._testTransitionData;
                  let phase = 'none';
                  if (td) {
                    if (td._fadeOutStart != null) { phase = 'fadeOut'; }
                    else {
                      const txEnd = td._txStart != null ? td._txStart + (td._fadeWindowEnd ?? 0) : null;
                      const inTx = txEnd != null ? now < txEnd : (now - (td._startTime || now)) < GESTURE_FADE;
                      const settled = td._txStart == null || (now - td._txStart) >= 0.017;
                      if (inTx && settled) phase = 'fadeIn';
                      else if (!inTx) phase = 'steady';
                    }
                  }
                  actor.physicalViolations.push({
                    bone: boneName, angle: +angle.toFixed(2), time: now,
                    gesture: actor.gestureGroup?.name || 'fading',
                    phase
                  });
                  console.warn(`[PHYSICAL VIOLATION] ${actor.id} ${boneName} snapped ${angle.toFixed(1)}° at ${now.toFixed(2)}s [${phase}]`);
                }
              }
              diagHtml += `<div>${boneName.padEnd(14)}: ${deg.x.toFixed(1)}, ${deg.y.toFixed(1)}, ${deg.z.toFixed(1)}</div>`;
            }
          }
          actor.lastRotations = currentRots;

          // Collect metrics for automated test
          if (isTest && actor._testTransitionData) {
            const td = actor._testTransitionData;
            const rots = sampleNodeRotations();
            const t = now - (td._startTime || now);

            const hipsBone = actor.mgr?.humanoidBone?.['hips'];
            const hipsPos = hipsBone ? hipsBone.getAbsolutePosition().clone() : null;
            if (td._fadeOutStart != null) {
              td.fadeOutFrames.push({ t, rots, hipsPos });
            } else {
              const txEnd = td._txStart != null ? td._txStart + (td._fadeWindowEnd ?? 0) : null;
              const inTx = txEnd != null ? now < txEnd : (now - (td._startTime || now)) < GESTURE_FADE;
              const settled = td._txStart == null || (now - td._txStart) >= 0.017;
              if (inTx && settled) td.fadeInFrames.push({ t, rots, hipsPos });
              else if (!inTx) td.steadyFrames.push({ t, rots, hipsPos });
            }
          }

          if (actor.physicalViolations.length > 0) diagHtml += `<div style="color:#f00;">Violations: ${actor.physicalViolations.length}</div>`;
          diagHtml += '<br/>';
        } else {
          actor.lastRotations = {};
        }
      }

      if (diagHtml) {
        diagEl.style.display = 'block';
        boneListEl.innerHTML = diagHtml;
      } else {
        diagEl.style.display = 'none';
      }
    });

    function startDiagnostics() {
      scene.onAfterAnimationsObservable.add(() => {
        for (const actor of Object.values(actors)) {
          // 0. POSE BRIDGE: Force-hold previous pose (Runs AFTER animations to overwrite retargeter snaps)
          if (actor._bridgePose && actor._bridgeFrames > 0) {
            actor._bridgePose.forEach((q, bone) => {
              if (!bone.rotationQuaternion) bone.rotationQuaternion = BABYLON.Quaternion.Identity();
              bone.rotationQuaternion.copyFrom(q);
            });
            actor._bridgeFrames--;
          }
        }
      });
    }

    // ── Timeline event player ──────────────────────────────────────────────────
    async function playEvent(event) {
      const actor = actors[event.actor];
      if (!actor) return;

      speakerEl.textContent = event.actor.toUpperCase();
      lineEl.textContent    = event.description ?? '';

      // 1. POSE PRESERVATION: Record current state BEFORE any modifications or async loads
      const bridgePose = new Map();
      const fullSnapshot = new Map();
      
      for (const boneName in actor.mgr.humanoidBone) {
        const bone = actor.mgr.humanoidBone[boneName];
        if (!bone || (!bone.rotation && !bone.rotationQuaternion)) continue;
        
        let q;
        if (bone.rotationQuaternion) {
          q = bone.rotationQuaternion.clone();
        } else if (bone.rotation) {
          q = BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z);
        } else {
          q = new BABYLON.Quaternion();
        }
        
        fullSnapshot.set(bone, q);
        bridgePose.set(bone, q.clone());
      }
      
      actor._bridgePose = bridgePose;
      actor._bridgeFrames = 300; 

      if (actor.gestureGroup) {
        actor.fadingGestures ??= [];
        const oldG = actor.gestureGroup;
        oldG._fadeOutStart = performance.now() / 1000;
        actor.fadingGestures.push(oldG);
        actor.gestureGroup = null;
      }
      resetFace(actor);
      actor.lastRotations = {};

      // Load body VRMA
      const clipDef = event.clip || event.layers?.BODY;
      if (clipDef) {
        const clipUrl = typeof clipDef === 'string' ? resolveAsset(clipDef) : resolveAsset(clipDef.url);
        actor._loading = true; 
        const g = await loadAndRetargetVRMA(actor, clipUrl, 'gesture', { fixRootPosition: false });
        actor._loading = false;
        
        if (g) {
          const gestureGroup = cloneRetargetedGroup(g, `${actor.id}-gesture`);

          if (USE_VRMA_TRANSITION) {
            const txGen = new TransitionGenerator(scene);
            const idleGroup = actor.idleGroup;

            const startPoseMap = {};
            for (const ta of gestureGroup.targetedAnimations) {
              const bone = ta.target;
              if (bone && fullSnapshot.has(bone)) startPoseMap[bone.name] = fullSnapshot.get(bone);
            }

            const { frameIndex: entryFrame } = txGen.findBestEntryFrame(gestureGroup, startPoseMap);
            
            const entryPose = txGen.evaluateFrame(gestureGroup, entryFrame);
            const idlePose = txGen.snapshotPose(idleGroup);
            
            let maxAngleDeg = 0;
            const targetedBones = gestureGroup.targetedAnimations.map(ta => ta.target).filter(Boolean);
            const idleBones = new Set(idleGroup.targetedAnimations.map(ta => ta.target).filter(Boolean));

            for (const bone of targetedBones) {
              const qG = entryPose[bone.name];
              const qI = idlePose[bone.name] || fullSnapshot.get(bone) || BABYLON.Quaternion.Identity();
              const qS = startPoseMap[bone.name] || qI;
              
              let qTarget = qG;
              if (idleBones.has(bone)) {
                let qIClamped = qI.clone();
                if (BABYLON.Quaternion.Dot(qG, qIClamped) < 0) qIClamped.scaleInPlace(-1);
                qTarget = BABYLON.Quaternion.Slerp(qIClamped, qG, 0.5);
              }

              let qTargetClamped = qTarget.clone();
              if (BABYLON.Quaternion.Dot(qS, qTargetClamped) < 0) qTargetClamped.scaleInPlace(-1);
              const angle = 2 * Math.acos(Math.min(1, Math.abs(BABYLON.Quaternion.Dot(qS, qTargetClamped)))) * 180 / Math.PI;
              if (angle > maxAngleDeg) maxAngleDeg = angle;
            }

            const adaptiveFrames = Math.min(MAX_TX_FRAMES, Math.max(MIN_TX_FRAMES, Math.ceil(maxAngleDeg / TARGET_DEG_PER_FRAME)));
            const txSeconds = adaptiveFrames / 60;
            
            if (isTest) {
              actor._pendingAngularDistDeg = maxAngleDeg;
              actor._pendingTxSeconds = txSeconds;
              actor._pendingTxStart = performance.now() / 1000;
            }

            actor._usingVRMATransition = true;
            actor.gestureGroup = gestureGroup;
            gestureGroup._startTime = performance.now() / 1000; 

            gestureGroup.start(false, 1.0, entryFrame, gestureGroup.to, false);
            gestureGroup.pause();
            gestureGroup.goToFrame(entryFrame);
            gestureGroup.weight = 0;

            let frameCounter = 0;
            const liveStartPose = new Map();

            actor._txCleanup = scene.onAfterAnimationsObservable.add(() => {
              if (!actor._usingVRMATransition) return;

              if (frameCounter === 0) {
                 for (const bone of targetedBones) {
                   liveStartPose.set(bone, (bone.rotationQuaternion || BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z)).clone());
                 }
                 actor._bridgePose = null;
                 actor._bridgeFrames = 0;
                 actor.lastRotations = {}; 
              }

              const t = Math.min(frameCounter / adaptiveFrames, 1.0);
              const easedT = t; 
              
              for (const bone of targetedBones) {
                if (!bone.rotationQuaternion) bone.rotationQuaternion = BABYLON.Quaternion.Identity();
                
                const qS = liveStartPose.get(bone) || BABYLON.Quaternion.Identity();
                const qG = txGen.evaluateBoneAtFrame(gestureGroup, bone, entryFrame);
                
                const qI = bone.rotationQuaternion.clone();

                let qTarget = qG.clone();
                if (idleBones.has(bone)) {
                  // Align idle with gesture for correct blend
                  let qIClamped = qI.clone();
                  if (BABYLON.Quaternion.Dot(qTarget, qIClamped) < 0) qIClamped.scaleInPlace(-1);
                  qTarget = BABYLON.Quaternion.Slerp(qIClamped, qTarget, 0.5);
                }

                // Align moving target with start pose to ensure shortest path
                if (BABYLON.Quaternion.Dot(qS, qTarget) < 0) qTarget.scaleInPlace(-1);
                
                const resultQ = BABYLON.Quaternion.Slerp(qS, qTarget, easedT);
                bone.rotationQuaternion.copyFrom(resultQ);
              }

              if (frameCounter >= adaptiveFrames) {
                gestureGroup.weight = 1;
                gestureGroup.play(false);
                actor._usingVRMATransition = false;
                if (actor._txCleanup) {
                  scene.onAfterAnimationsObservable.remove(actor._txCleanup);
                  actor._txCleanup = null;
                }
                return;
              }
              frameCounter++;
            });
            console.log(`[scene] VRMA transition (dynamic): ${adaptiveFrames}fr (${txSeconds.toFixed(2)}s), entry ${entryFrame}, ${maxAngleDeg.toFixed(1)}°`);
          } else if (USE_INERTIAL) {
            // ... (Inertial code remains same)
          } else if (USE_MATCH_CROSSFADE) {
            // ... (Match code remains same)
          } else if (USE_WEIGHT_TRANSITION) {
            // ... (Weight code remains same)
          }
        }
      }

      const faceURL = resolveAsset(event.lipSync || event.layers?.FACE);
      const fa = await loadFaceJSON(faceURL);
      if (fa) {
        fa.startT = performance.now() / 1000;
        actor.faceAnim = fa;
      }

      const maxDur = parseFloat(urlParams.get('maxdur')) || 0;
      const dur = maxDur > 0 ? maxDur : (event.duration ?? 4);
      const start = performance.now();
      
      if (isTest) {
        _testEventIdx++;
        _testFrameDeltas[_testEventIdx] = { maxDeg: 0, worstBone: '', numBones: 0 };
        actor._testTransitionData = {
          evIdx: _testEventIdx, actorId: actor.id,
          clipUrl: clipDef ? (typeof clipDef === 'string' ? clipDef : clipDef.url) : null,
          hasGesture: !!actor.gestureGroup,
          fadeInFrames: [], steadyFrames: [], fadeOutFrames: [],
          _startTime: start / 1000,
          _txStart: actor._pendingTxStart ?? null,
          _fadeWindowEnd: actor._pendingTxSeconds ?? GESTURE_FADE,
          transitionAngularDistDeg: actor._pendingAngularDistDeg ?? null,
          maxKeyDeltaDeg: actor._pendingMaxKeyDelta ?? null,
        };
        actor._pendingAngularDistDeg = undefined;
        actor._pendingTxSeconds = undefined;
        actor._pendingTxStart = undefined;
        actor._pendingMaxKeyDelta = undefined;
      }

      await new Promise(resolve => {
        let check = setInterval(() => {
          const elapsed = (performance.now() - start) / 1000;
          progEl.style.width = (Math.min(elapsed / dur, 1) * 100).toFixed(1) + '%';
          if (elapsed >= dur) {
            clearInterval(check);
            resolve();
          }
        }, 16);
      });

      if (actor.gestureGroup) {
        actor.gestureGroup._isStopping = true;
        actor.gestureGroup._stopTime = performance.now() / 1000;
      }

      // Fade-out capture: wait for gesture weight to reach 0 + settle
      if (isTest && actor._testTransitionData && actor.gestureGroup) {
        const td = actor._testTransitionData;
        td._fadeOutStart = performance.now() / 1000;
        const fadeWait = GESTURE_FADE + 0.2; // wait for full fade-out + settle
        await new Promise(resolve => {
          let check = setInterval(() => {
            const elapsed = (performance.now() - start) / 1000;
            progEl.style.width = (Math.min(elapsed / (dur + fadeWait), 1) * 100).toFixed(1) + '%';
            if (elapsed >= dur + fadeWait) {
              clearInterval(check);
              resolve();
            }
          }, 16);
        });
      }
      
      progEl.style.width = '0%';
      if (isTest && actor._testTransitionData) {
         computeTransitionMetrics(actor._testTransitionData);
      }
    }

    const _testFrameDeltas = []; let _testEventIdx = -1;

    function sampleNodeRotations() {
      const out = {};
      for (const actor of Object.values(actors)) {
        actor.root.getChildTransformNodes(false).forEach(node => {
          const stack = [node];
          while (stack.length > 0) {
            const child = stack.pop();
            if (child.name) {
              const q = child.rotationQuaternion;
              const r = child.rotation;
              if (q) out[child.name] = q.clone();
              else out[child.name] = BABYLON.Quaternion.RotationYawPitchRoll(r.y, r.x, r.z);
            }
            stack.push(...child.getChildTransformNodes(false));
          }
        });
      }
      return out;
    }

    function maxRotationDelta(before, after) {
      let maxDeg = 0;
      let worstBone = '';
      for (const name of Object.keys(before)) {
        const a = before[name], b = after[name];
        if (!a || !b) continue;
        const dot = Math.abs(a.x*b.x + a.y*b.y + a.z*b.z + a.w*b.w);
        const deg = 2 * Math.acos(Math.min(1, dot)) * 57.2958;
        if (deg > maxDeg) { maxDeg = deg; worstBone = name; }
      }
      return { maxDeg, worstBone, numBones: Object.keys(before).length };
    }

    function perBoneMaxDegPerFrame(frames, boneFilter) {
      const perBone = {};
      if (frames.length < 2) return perBone;
      for (let i = 1; i < frames.length; i++) {
        const before = frames[i-1].rots;
        const after = frames[i].rots;
        for (const name of Object.keys(before)) {
          if (boneFilter && !boneFilter.has(name)) continue;
          const a = before[name], b = after[name];
          if (!a || !b) continue;
          const dot = Math.abs(a.x*b.x + a.y*b.y + a.z*b.z + a.w*b.w);
          const deg = 2 * Math.acos(Math.min(1, dot)) * 57.2958;
          perBone[name] = Math.max(perBone[name] ?? 0, deg);
        }
      }
      return perBone;
    }

    function maxFromPerBone(perBone) {
      let maxDeg = 0, worstBone = '';
      for (const [name, deg] of Object.entries(perBone)) {
        if (deg > maxDeg) { maxDeg = deg; worstBone = name; }
      }
      return { maxDeg, worstBone };
    }

    function computeTransitionMetrics(data) {
      const limbNames = getLimbNodeNames();
      const limbFilter = limbNames.size > 0 ? limbNames : null;

      // Per-frame Hips position deltas (translation snap)
      function perFrameHipsDelta(frames) {
        let maxDelta = 0;
        for (let i = 1; i < frames.length; i++) {
          const a = frames[i-1].hipsPos;
          const b = frames[i].hipsPos;
          if (a && b) {
            const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (dist > maxDelta) maxDelta = dist;
          }
        }
        return maxDelta;
      }
      const hipFadeInDelta = perFrameHipsDelta(data.fadeInFrames);
      const hipSteadyDelta = perFrameHipsDelta(data.steadyFrames);
      const hipFadeOutDelta = perFrameHipsDelta(data.fadeOutFrames);

      // Fade-in vs steady
      let fadeInPB = perBoneMaxDegPerFrame(data.fadeInFrames, limbFilter);
      let steadyPB = perBoneMaxDegPerFrame(data.steadyFrames, limbFilter);
      const fadeIn = maxFromPerBone(fadeInPB);
      const steady = maxFromPerBone(steadyPB);
      const ftRatio = steady.maxDeg > 0.01 ? fadeIn.maxDeg / steady.maxDeg : (fadeIn.maxDeg > 0.01 ? 99 : 0);

      // Fade-out vs steady
      let fadeOutPB = perBoneMaxDegPerFrame(data.fadeOutFrames, limbFilter);
      const fadeOut = maxFromPerBone(fadeOutPB);
      const foRatio = steady.maxDeg > 0.01 ? fadeOut.maxDeg / steady.maxDeg : (fadeOut.maxDeg > 0.01 ? 99 : 0);

      // Return snap: angle between last fade-out frame and last steady frame (same idle reference)
      let returnSnapMaxDeg = 0, syncSnapMaxDeg = 0;
      let worstBoneReturn = '', syncWorstBone = '';
      const foFrames = data.fadeOutFrames;
      if (foFrames.length >= 2) {
        const lastFO = foFrames[foFrames.length - 1].rots;
        const firstFO = foFrames[0].rots;
        const steadyFrames = data.steadyFrames;
        const lastSteady = steadyFrames.length > 0 ? steadyFrames[steadyFrames.length - 1].rots : firstFO;

        for (const name of Object.keys(lastFO)) {
          if (limbFilter && !limbFilter.has(name)) continue;
          const snapQ = lastFO[name], refQ = lastSteady[name];
          if (!snapQ || !refQ) continue;
          const dot = Math.abs(snapQ.x*refQ.x + snapQ.y*refQ.y + snapQ.z*refQ.z + snapQ.w*refQ.w);
          const deg = 2 * Math.acos(Math.min(1, dot)) * 57.2958;
          if (deg > returnSnapMaxDeg) { returnSnapMaxDeg = deg; worstBoneReturn = name; }
        }

        // Sync snap: last fade-out vs first fade-out (immediate post-gesture snap)
        for (const name of Object.keys(lastFO)) {
          if (limbFilter && !limbFilter.has(name)) continue;
          const snapQ = lastFO[name], refQ = firstFO[name];
          if (!snapQ || !refQ) continue;
          const dot = Math.abs(snapQ.x*refQ.x + snapQ.y*refQ.y + snapQ.z*refQ.z + snapQ.w*refQ.w);
          const deg = 2 * Math.acos(Math.min(1, dot)) * 57.2958;
          if (deg > syncSnapMaxDeg) { syncSnapMaxDeg = deg; syncWorstBone = name; }
        }
      }

      _testFrameDeltas[data.evIdx].transition = {
        actor: data.actorId, clip: data.clipUrl, hasGesture: data.hasGesture,
        evIdx: data.evIdx,
        fadeInMaxDegPerFrame: +fadeIn.maxDeg.toFixed(2),
        steadyMaxDegPerFrame: +steady.maxDeg.toFixed(2),
        fadeToSteadyRatio: +ftRatio.toFixed(1),
        worstBoneFadeIn: { name: fadeIn.worstBone, degPerFrame: +fadeIn.maxDeg.toFixed(2) },
        perBoneSteady: Object.fromEntries(Object.entries(steadyPB).map(([k,v]) => [k, +v.toFixed(2)])),
        // Fade-out
        fadeOutMaxDegPerFrame: +fadeOut.maxDeg.toFixed(2),
        fadeOutToSteadyRatio: +foRatio.toFixed(1),
        worstBoneFadeOut: { name: fadeOut.worstBone, degPerFrame: +fadeOut.maxDeg.toFixed(2) },
        perBoneFadeOut: Object.fromEntries(Object.entries(fadeOutPB).map(([k,v]) => [k, +v.toFixed(2)])),
        // Return snap
        returnSnapMaxDeg: +returnSnapMaxDeg.toFixed(2),
        worstBoneReturn: { name: worstBoneReturn, deg: +returnSnapMaxDeg.toFixed(2) },
        perBoneReturnSnap: (() => {
          const m = {};
          if (foFrames.length >= 2) {
            const lastFO = foFrames[foFrames.length - 1].rots;
            const steadyFrames = data.steadyFrames;
            const lastSteady = steadyFrames.length > 0 ? steadyFrames[steadyFrames.length - 1].rots : foFrames[0].rots;
            for (const name of Object.keys(lastFO)) {
              if (limbFilter && !limbFilter.has(name)) continue;
              const snapQ = lastFO[name], refQ = lastSteady[name];
              if (!snapQ || !refQ) continue;
              const dot = Math.abs(snapQ.x*refQ.x + snapQ.y*refQ.y + snapQ.z*refQ.z + snapQ.w*refQ.w);
              m[name] = +(2 * Math.acos(Math.min(1, dot)) * 57.2958).toFixed(2);
            }
          }
          return m;
        })(),
        syncSnapMaxDeg: +syncSnapMaxDeg.toFixed(2),
        syncWorstBone,
        // Angular distance from start pose
        transitionAngularDistDeg: data.transitionAngularDistDeg ?? null,
        // Hips position deltas
        hipPosMaxDeltaFadeIn: +hipFadeInDelta.toFixed(4),
        hipPosMaxDeltaSteady: +hipSteadyDelta.toFixed(4),
        hipPosMaxDeltaFadeOut: +hipFadeOutDelta.toFixed(4),
        hipPosReturnSnap: (() => {
          const foFrames = data.fadeOutFrames;
          const stFrames = data.steadyFrames;
          if (foFrames.length < 1 || stFrames.length < 1) return null;
          const lastFO = foFrames[foFrames.length - 1].hipsPos;
          const lastSt = stFrames[stFrames.length - 1].hipsPos;
          if (!lastFO || !lastSt) return null;
          const dx = lastFO.x - lastSt.x, dy = lastFO.y - lastSt.y, dz = lastFO.z - lastSt.z;
          return +Math.sqrt(dx*dx + dy*dy + dz*dz).toFixed(4);
        })(),
      };
    }

    async function runScene() {
      const timeline = sceneData.timeline ?? [];
      _testFrameDeltas.length = 0;
      for (let i = 0; i < timeline.length; i++) {
        await playEvent(timeline[i]);
        await new Promise(r => setTimeout(r, 400));
      }
      speakerEl.textContent = '';
      lineEl.textContent    = '— end —';
      if (isTest) {
        const overallMax = _testFrameDeltas.reduce((m, d) => Math.max(m, d.maxDeg), 0);
        const SNAP_THRESH = parseFloat(urlParams.get('snap')) || 1.0;
        const allViolations = Object.values(actors).flatMap(a => a.physicalViolations || []);
        const phaseCounts = { fadeIn: 0, steady: 0, fadeOut: 0, none: 0 };
        for (const v of allViolations) { if (phaseCounts[v.phase] !== undefined) phaseCounts[v.phase]++; }
        window.__TEST_DATA = {
          completed: true,
          maxBoneRotationDeg: +overallMax.toFixed(2),
          physicalViolations: allViolations,
          violationsByPhase: phaseCounts,
          transitionSmooth: {
            thresholds: { FADE_TO_STEADY_RATIO: 3.0, RETURN_SNAP_DEG: SNAP_THRESH },
            events: _testFrameDeltas.map(d => d.transition ?? null).filter(Boolean)
          }
        };
        document.body.setAttribute('data-status', 'complete');
      }
    }

    for (const actorDef of (sceneData.actors ?? [])) {
      await loadActor(actorDef);
    }

    // Build tracked bones from all loaded actors (non-finger humanoid bones)
    const allKeys = new Set();
    for (const actor of Object.values(actors)) {
      if (!actor.mgr?.humanoidBone) continue;
      for (const key of Object.keys(actor.mgr.humanoidBone)) {
        if (key === 'nodeMap' || FINGER_BONE_RE.test(key)) continue;
        allKeys.add(key);
      }
    }
    if (allKeys.size > 0) TRACKED_BONES = [...allKeys];

    startDiagnostics();

    if (isTest) {
      loadEl.style.display = 'none';
      engine.runRenderLoop(() => { scene.render(); });
      window.addEventListener('resize', () => engine.resize());
      runScene();
    } else {
      loadEl.style.display = 'none';
      lineEl.textContent   = 'Click to begin';
      speakerEl.textContent = '';
      await new Promise(resolve => canvas.addEventListener('click', resolve, { once: true }));
      lineEl.textContent = '';
      engine.runRenderLoop(() => { scene.render(); });
      window.addEventListener('resize', () => engine.resize());
      runScene();
    }
  </script>
</body>
