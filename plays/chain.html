<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Animation Chain Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="data:,">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <script>
    window.LOADERS = BABYLON;
    window.BABYLON = BABYLON;
  </script>
  <script src="https://xuhuisheng.github.io/babylonjs-vrm/babylon-vrm-loader.js"></script>

  <style>
    html, body, #renderCanvas { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #05050a; }
    #overlay {
      position: absolute; top: 20px; left: 20px;
      color: #aef; font: 14px monospace; background: rgba(0,0,0,0.6);
      padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    .val { color: #fff; font-weight: bold; }
    #help {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.4); font: 12px monospace;
      background: rgba(0,0,0,0.4); padding: 8px 16px;
      border-radius: 6px; pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body data-status="loading">

  <canvas id="renderCanvas"></canvas>

  <div id="help">WASD move · Q/E up/down · Mouse orbit · Scroll zoom · R reset view</div>

  <div id="overlay">
    <div>Clip: <span id="ui-clip" class="val">-</span></div>
    <div>Pos: <span id="ui-pos" class="val">0, 0, 0</span></div>
    <div>Cam: <span id="ui-cam" class="val">0, 0</span></div>
    <div id="ui-msg" style="margin-top:10px; opacity:0.6;">Initializing...</div>
  </div>

  <script type="module">
    import { ChainStage } from "./js/ChainStage.js";
    import { Character } from "./js/Character.js";
    import { ChainTimeline } from "./js/ChainTimeline.js";

    BABYLON.TransformNode.prototype.getTotalVertices ??= () => 0;

    const clipEl = document.getElementById("ui-clip");
    const posEl = document.getElementById("ui-pos");
    const camEl = document.getElementById("ui-cam");
    const msgEl = document.getElementById("ui-msg");

    const stage = new ChainStage("renderCanvas");
    const configUrl = new URLSearchParams(location.search).get("config") || "chain.json";
    const chainData = await fetch(configUrl).then(r => r.json());

    const resolveVRM = p => (p && !p.startsWith("http")) ? "../" + p : p;

    async function init() {
        msgEl.textContent = "Loading VRM...";
        const def = chainData.actor;
        const beforeCount = stage.scene.metadata?.vrmManagers?.length ?? 0;
        const existingRoots = new Set(stage.scene.rootNodes.map(n => n.uniqueId));

        await BABYLON.SceneLoader.ImportMeshAsync(null, resolveVRM(def.vrm), null, stage.scene);

        const mgr = stage.scene.metadata?.vrmManagers?.[beforeCount];
        const root = stage.scene.rootNodes.find(n => !existingRoots.has(n.uniqueId));

        if (!mgr || !root) {
            msgEl.textContent = "Failed to load actor.";
            return;
        }

        const character = new Character(def.id, root, mgr);
        const timeline = new ChainTimeline(stage, character, def);

        // Debug: Granular VRMA track inspection
        window.inspectVRMA = async (url) => {
            const container = await BABYLON.LoadAssetContainerAsync(url, stage.scene);
            const group = container.animationGroups[0];
            console.log(`[Debug] Inspecting VRMA: ${url}`);
            group.targetedAnimations.forEach(ta => {
                if (ta.animation.targetProperty === "rotationQuaternion") {
                    const keys = ta.animation.getKeys();
                    const first = keys[0].value.toEulerAngles();
                    const last = keys[keys.length - 1].value.toEulerAngles();
                    const deltaY = (last.y - first.y) * 57.3;
                    if (Math.abs(deltaY) > 5) {
                        console.log(`[Debug]   Track ${ta.target.name}: Delta Y ${deltaY.toFixed(1)}° (First: ${(first.y*57.3).toFixed(1)}°, Last: ${(last.y*57.3).toFixed(1)}°)`);
                    }
                }
            });
            container.dispose();
        };

        // Expose for diagnostic analysis
        window.stage = stage;
        window.scene = stage.scene;
        window.character = character;

        msgEl.textContent = "Ready. Click to start chain.";
        document.body.setAttribute("data-status", "ready");

        window.addEventListener("click", () => {
            msgEl.textContent = "Sequence started.";
            stage.startRenderLoop();
            timeline.playNext(chainData.sequence);

            // Update UI loop
            stage.scene.onBeforeRenderObservable.add(() => {
                stage.moveSpeed(stage.engine.getDeltaTime() / 1000);
                const pos = character.root.position;
                posEl.textContent = `${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}`;
                camEl.textContent = `${(stage.camera.alpha * 57.3).toFixed(0)}°, ${(stage.camera.beta * 57.3).toFixed(0)}°`;
                clipEl.textContent = document.body.getAttribute("data-current") || "-";
            });
        }, { once: true });
    }

    init().catch(err => {
        console.error(err);
        msgEl.textContent = "Error: " + err.message;
    });
  </script>

</body>
</html>
