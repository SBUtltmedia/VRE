name: Deploy CDN to GitHub Pages

on:
  push:
    branches: [main, babvrm, paul]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Stage CDN assets
        run: |
          mkdir -p _site/vrma
          mkdir -p _site/js

          # Sync root models
          mkdir -p _site/models
          cp models/*.vrm _site/models/ 2>/dev/null || true
          cp models/*.glb _site/models/ 2>/dev/null || true

          # Sync a subset of model categories to stay under 1GB
          for d in models/AIAN models/Asian models/Black models/Hispanic models/MENA models/NHPI models/White models/X_Non-validated; do
            if [ -d "$d" ]; then
              dir_name=$(basename "$d")
              mkdir -p "_site/models/$dir_name"
              ls "$d"/*.vrm "$d"/*.glb 2>/dev/null | head -n 1 | xargs -I {} cp {} "_site/models/$dir_name/"
            fi
          done

          # All VRMA animation clips
          VRMA_SRC=""
          if [ -d VRMA ]; then VRMA_SRC="VRMA"; elif [ -d vrma ]; then VRMA_SRC="vrma"; fi
          
          if [ -n "$VRMA_SRC" ]; then
            ls "$VRMA_SRC"/*.vrma | head -n 200 | xargs -I {} cp {} _site/vrma/
            echo "Copied $(ls _site/vrma/ | wc -l) vrma files from $VRMA_SRC"
            
            # Executed inline to preserve flat YAML block spacing perfectly
            python3 -c "import json, os; valid = set(os.listdir('_site/vrma')); f = open('animations.json', 'r'); data = json.load(f); f.close(); filtered = [a for a in data if os.path.basename(a['url']) in valid]; f = open('_site/animations.json', 'w'); json.dump(filtered, f, indent=2); f.close(); print(f'Filtered animations.json: {len(data)} -> {len(filtered)} entries')"
          else
            cp animations.json _site/ 2>/dev/null || echo "animations.json not found"
          fi

          # JS libraries
          if [ -d js ]; then
            cp -r js/. _site/js/
          fi

          # HTML demo pages from root
          for f in *.html; do
            [ -f "$f" ] && cp "$f" _site/
          done

          # plays/ directory
          if [ -d plays ]; then
            mkdir -p _site/plays
            cp -r plays/. _site/plays/
          fi

          # Create index.html using an explicitly indented heredoc configuration
          cat << 'INDEXEOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>VRE — Babylon.js VRM/VRMA CDN</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
              h1 { color: #1a1a2e; }
              h2 { border-bottom: 1px solid #ddd; padding-bottom: .3em; }
              a.demo { display: inline-block; margin: .4em .6em .4em 0; padding: .4em .9em; background: #0076ff; color: #fff; border-radius: 4px; text-decoration: none; }
              a.demo:hover { background: #005acc; }
              code { background: #f4f4f4; padding: .1em .4em; border-radius: 3px; font-size: .9em; }
              .assets { font-size: .85em; color: #555; }
            </style>
          </head>
          <body>
            <h1>VRE — Babylon.js VRM/VRMA CDN</h1>
            <h2>Live Demos</h2>
            <a class="demo" href="babvrm.html">babvrm.html — VRM + VRMA player</a>
            <a class="demo" href="walk_and_talk.html">walk_and_talk.html — Walk & Talk (A2F JSON)</a>
            <a class="demo" href="arkit_compat_test_babylon.html">arkit_compat_test_babylon.html — ARKit expression cycler</a>
            <h2>CDN Asset URLs</h2>
            <p class="assets">Base: <code>https://tltmedia.github.io/VRET/</code></p>
            <h3>VRM Models</h3>
            <ul class="assets">
              <li><code>models/Cop.vrm</code></li>
              <li><code>models/Seed-san.vrm</code></li>
              <li><code>models/AIAN/AIAN_F_1_Casual.vrm</code></li>
            </ul>
            <h3>VRMA Animations</h3>
            <p class="assets">Limited set (200 clips) hosted on GitHub Pages due to 1GB limit. Full set (2500+) available in the repository.<br>List: <a href="animations.json">animations.json</a>.<br>Example: <code>vrma/11_01.vrma</code></p>
          </body>
          </html>
          INDEXEOF

          echo "--- Staged sizes ---"
          du -sh _site/models _site/vrma _site/js 2>/dev/null || true
          du -sh _site/
          echo "--- File count ---"
          find _site -type f | wc -l

      - name: Find large files causing heavy deployment
        run: |
          echo "=== Top 20 Largest Folders/Files ==="
          du -ah . | sort -rh | head -n 20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4