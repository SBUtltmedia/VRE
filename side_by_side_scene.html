<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Side-by-Side Scene</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <style>
    html, body, #renderCanvas { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0a0a12; }

    #ui {
      position:absolute; bottom:0; left:0; right:0;
      padding:16px 32px 24px;
      background:linear-gradient(transparent, rgba(0,0,0,.72));
      font-family:Georgia, serif; color:#fff; pointer-events:none;
      text-align:center;
    }
    #speaker { font-size:12px; letter-spacing:.15em; text-transform:uppercase;
               opacity:.55; margin-bottom:5px; }
    #line    { font-size:16px; line-height:1.55; max-width:600px; margin:0 auto;
               text-shadow:0 1px 6px rgba(0,0,0,.9); min-height:1.6em; }
    #prog-bg { height:2px; background:rgba(255,255,255,.12); border-radius:1px; margin-top:12px; }
    #prog-bar{ height:100%; background:rgba(180,200,255,.65); border-radius:1px;
               width:0%; transition:width .12s linear; }

    /* Speaker name plates — one under each character */
    #plates { position:absolute; bottom:90px; left:0; right:0;
              display:flex; justify-content:space-around; pointer-events:none; }
    .plate  { font:11px/1 monospace; letter-spacing:.12em; text-transform:uppercase;
              color:rgba(255,255,255,.35); padding:4px 10px;
              background:rgba(0,0,0,.4); border-radius:4px; }
    .plate.active { color:#aef; background:rgba(40,80,140,.55); }

    #start-overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(10,10,18,.88); cursor:pointer; z-index:10;
      font:18px Georgia, serif; color:rgba(255,255,255,.7); letter-spacing:.06em;
    }
    #loading {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font:13px monospace; color:rgba(255,255,255,.4); background:#0a0a12; z-index:20;
    }

    /* Status indicator — colored LED shows current state, not intended action */
    #head-toggle {
      position:fixed; top:16px; right:16px;
      background:rgba(0,0,0,.45); color:rgba(255,255,255,.7);
      border:1px solid rgba(255,255,255,.15); border-radius:4px;
      font:11px/1 monospace; letter-spacing:.1em; text-transform:uppercase;
      padding:7px 13px; cursor:pointer; z-index:100; user-select:none;
      display:flex; align-items:center; gap:7px;
    }
    #head-toggle .led {
      width:8px; height:8px; border-radius:50%;
      background:#4bf; box-shadow:0 0 5px #4bf;
      transition:background .3s, box-shadow .3s;
      flex-shrink:0;
    }
    #head-toggle.off .led {
      background:#444; box-shadow:none;
    }
    #head-toggle .hint { opacity:.4; font-size:9px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="ui">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="prog-bg"><div id="prog-bar"></div></div>
  </div>

  <div id="plates"></div>

  <div id="loading">Loading scene…</div>
  <div id="start-overlay" style="display:none">Click to begin</div>
  <button id="head-toggle"><span class="led"></span>HEAD TILT<span class="hint">H</span></button>

  <script type="module">
    BABYLON.TransformNode.prototype.getTotalVertices ??= () => 0;

    const speakerEl    = document.getElementById('speaker');
    const lineEl       = document.getElementById('line');
    const progEl       = document.getElementById('prog-bar');
    const platesEl     = document.getElementById('plates');
    const loadEl       = document.getElementById('loading');
    const startEl      = document.getElementById('start-overlay');
    const headToggleEl = document.getElementById('head-toggle');

    // ── Load resources ─────────────────────────────────────────────────────────
    const [, sceneData] = await Promise.all([
      new Promise((res, rej) => {
        window.LOADERS = BABYLON;
        const s = document.createElement('script');
        s.src = 'https://xuhuisheng.github.io/babylonjs-vrm/babylon-vrm-loader.js';
        s.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'vrm1-loader.js';
          s2.onload = res;
          s2.onerror = () => res(); // non-fatal
          document.head.appendChild(s2);
        };
        s.onerror = rej;
        document.head.appendChild(s);
      }),
      fetch('traffic_scene.json').then(r => r.json()),
    ]);

    // ── Engine + scene ─────────────────────────────────────────────────────────
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene  = new BABYLON.Scene(engine);
    window.scene = scene;

    scene.ambientColor = new BABYLON.Color3(.04, .04, .08);
    scene.clearColor   = new BABYLON.Color4(.03, .03, .07, 1);

    // Ambient fill — cool, dim
    const fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0, 1, 0), scene);
    fill.intensity   = .3;
    fill.diffuse     = new BABYLON.Color3(.55, .65, 1);
    fill.groundColor = new BABYLON.Color3(.04, .04, .08);

    // Shared key — warm overhead (streetlamp feel)
    const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(.2, -1, .4), scene);
    key.intensity = .9;
    key.diffuse   = new BABYLON.Color3(1, .93, .8);

    // Speaker spot — moves to active actor, highlights their face
    const spot = new BABYLON.PointLight('spot', new BABYLON.Vector3(0, 2, 1), scene);
    spot.diffuse    = new BABYLON.Color3(1, .97, .9);
    spot.intensity  = 1.1;
    spot.range      = 3.0;

    // Placeholder camera; repositioned after both VRMs load
    const camera = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0, 1.6, 1.5), scene);
    camera.setTarget(new BABYLON.Vector3(0, 1.55, 0));
    camera.minZ = 0.01;

    // ── Face animation helpers ─────────────────────────────────────────────────
    function evalExprChannel(ch, t) {
      const { times, weights } = ch;
      if (t <= times[0]) return weights[0];
      if (t >= times[times.length - 1]) return weights[weights.length - 1];
      for (let i = 1; i < times.length; i++) {
        if (t <= times[i]) {
          const u = (t - times[i - 1]) / (times[i] - times[i - 1]);
          return weights[i - 1] * (1 - u) + weights[i] * u;
        }
      }
      return weights[weights.length - 1];
    }

    async function loadFaceJSON(url) {
      let data;
      try { data = await fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }); }
      catch (e) { console.warn('[side] Face JSON fetch failed:', url, e); return null; }
      const { names, frames } = data;
      if (!names?.length || !frames?.length) return null;
      const times    = frames.map(f => f.time);
      const duration = times[times.length - 1] ?? 0;
      const channels = names.map((name, i) => ({
        name, times,
        weights: frames.map(f => f.weights[i] ?? 0),
      }));
      return { channels, duration, startT: null };
    }

    // ── Actor loader ───────────────────────────────────────────────────────────
    const actors = {};
    window.actors = actors;

    async function loadActor(id, vrmPath, worldX) {
      loadEl.textContent = `Loading ${id}…`;
      const preMgrCount = scene.metadata?.vrmManagers?.length ?? 0;
      const preRootIds  = new Set(scene.rootNodes.map(n => n.uniqueId));

      await BABYLON.ImportMeshAsync(vrmPath, scene);

      const mgr  = scene.metadata?.vrmManagers?.[preMgrCount];
      const root = scene.rootNodes.find(n => !preRootIds.has(n.uniqueId));
      if (!mgr || !root) { console.error('[side] Load failed for', id); return; }

      // Place side-by-side facing camera (+Z in BJS)
      root.position.set(worldX, 0, 0);

      // Build morph target map (same name & stripped-prefix entries)
      const morphMap = new Map();
      for (const mesh of root.getChildMeshes(false)) {
        const mtm = mesh.morphTargetManager;
        if (!mtm) continue;
        for (let i = 0; i < mtm.numTargets; i++) {
          const mt = mtm.getTarget(i);
          if (!mt.name) continue;
          morphMap.set(mt.name, mt);
          const dot = mt.name.indexOf('.');
          if (dot !== -1) morphMap.set(mt.name.slice(dot + 1), mt);
        }
      }

      actors[id] = { id, mgr, root, morphMap, faceAnim: null, worldX };
      console.log(`[side] ${id} loaded  morphMap:${morphMap.size}`);
    }

    // ── Load both actors ───────────────────────────────────────────────────────
    // VRM files hosted as GitHub Release assets (too large for git HTTPS push).
    // Local paths in traffic_scene.json are remapped here to release CDN URLs.
    const RELEASE_BASE = 'https://github.com/TLTMedia/VRET/releases/download/v1.0-demo-models';
    const RELEASE_VRMS = {
      'models/Black/Black_F_1_Casual.vrm': `${RELEASE_BASE}/Black_F_1_Casual.vrm`,
      'models/White/White_M_1_Util.vrm':   `${RELEASE_BASE}/White_M_1_Util.vrm`,
    };
    // BJS left-handed + camera looking -Z flips world X on screen: +X → screen left.
    // a0 (jordan) at +0.3 → screen left; a1 (officer) at -0.3 → screen right.
    const [a0, a1] = sceneData.actors;
    const resolveVRM = p => RELEASE_VRMS[p] ?? p;
    await loadActor(a0.id, resolveVRM(a0.vrm), +0.3);
    await loadActor(a1.id, resolveVRM(a1.vrm), -0.3);

    loadEl.textContent = 'Positioning camera…';

    // ── Camera: frame both faces at arkit_demo zoom ────────────────────────────
    // Force bone world matrices then sample actual head positions
    scene.render();

    function getFacePos(actor) {
      const bones = actor.mgr?.humanoidBone ?? {};
      const pts = ['leftEye','rightEye','head']
        .map(n => { const b = bones[n]; b?.computeWorldMatrix?.(true); return b?.getAbsolutePosition?.(); })
        .filter(Boolean);
      if (!pts.length) return new BABYLON.Vector3(actor.worldX, 1.6, 0);
      return new BABYLON.Vector3(
        pts.reduce((s,p)=>s+p.x,0)/pts.length,
        pts.reduce((s,p)=>s+p.y,0)/pts.length,
        pts.reduce((s,p)=>s+p.z,0)/pts.length,
      );
    }

    const faceA = getFacePos(actors[a0.id]);
    const faceB = getFacePos(actors[a1.id]);

    // midpoint between the two faces
    const mid = faceA.add(faceB).scale(0.5);

    // Half-width of the framing box (distance between faces / 2 + small margin)
    const halfW = Math.abs(faceB.x - faceA.x) * 0.5 + 0.15;
    // Camera distance: BJS default vertical FOV ~45.8°, horizontal ~73° at 16:9.
    // Half horizontal FOV ≈ 37° → tan 37° ≈ 0.75. Min 0.65 m for tight close-up.
    const camDist = Math.max(0.65, halfW / Math.tan(37 * Math.PI / 180));

    camera.position = new BABYLON.Vector3(mid.x, mid.y, mid.z + camDist);
    camera.setTarget(mid);
    spot.position   = new BABYLON.Vector3(mid.x, mid.y + 0.4, mid.z + camDist * 0.6);

    console.log(`[side] faces: A${faceA.toString()} B${faceB.toString()} mid${mid.toString()} camDist:${camDist.toFixed(2)}`);

    // ── Procedural head tilt ───────────────────────────────────────────────────
    // Derives subtle head movement from speech energy (jawOpen + mouthFunnel) so
    // no extra animation file is needed. Toggle with H key or the on-screen button.
    let headTiltEnabled = true;
    const headStates = {};

    // Capture rest rotation for head and neck bones — same pattern as
    // arkit-face-driver.js eye bone handling (rotationQuaternion ?? Identity).
    for (const actor of Object.values(actors)) {
      const head = actor.mgr?.humanoidBone?.head;
      const neck = actor.mgr?.humanoidBone?.neck;
      if (!head) { console.warn('[side] head bone not found for', actor.id); continue; }
      headStates[actor.id] = {
        energy: 0, tiltZ: 0, tiltX: 0,
        phase:    Math.random() * Math.PI * 2,
        head,     neck,
        headBase: head.rotationQuaternion?.clone() ?? BABYLON.Quaternion.Identity(),
        neckBase: neck?.rotationQuaternion?.clone() ?? BABYLON.Quaternion.Identity(),
      };
      console.log(`[side] headState init ${actor.id} — head:${head.name} neck:${neck?.name}`);
    }

    function tickHead(actor, now) {
      const s = headStates[actor.id];
      if (!s) return;

      if (!headTiltEnabled) {
        s.tiltZ  *= 0.85;
        s.tiltX  *= 0.85;
        s.energy *= 0.85;
      } else {
        // Speech energy from jaw + lip channels
        let targetEnergy = 0;
        const fa = actor.faceAnim;
        if (fa?.startT) {
          const t = now - fa.startT;
          const jawCh = fa.channels.find(c => c.name === 'jawOpen');
          const lipCh = fa.channels.find(c => c.name === 'mouthFunnel');
          if (jawCh) targetEnergy += evalExprChannel(jawCh, t) * 0.7;
          if (lipCh) targetEnergy += evalExprChannel(lipCh, t) * 0.3;
        }
        s.energy += (targetEnergy - s.energy) * 0.08;

        // Slow sinusoidal roll sway — unique phase per actor
        const driftTarget = Math.sin(now * 0.38 + s.phase) * 0.06;
        s.tiltZ += (driftTarget - s.tiltZ) * 0.04;

        // Speech energy → forward pitch nod
        s.tiltX += (s.energy * -0.12 - s.tiltX) * 0.06;
      }

      // Head gets full tilt; neck gets 40% to distribute across cervical spine
      const headTilt = BABYLON.Quaternion.FromEulerAngles(s.tiltX,       0, s.tiltZ);
      const neckTilt = BABYLON.Quaternion.FromEulerAngles(s.tiltX * 0.4, 0, s.tiltZ * 0.4);
      s.head.rotationQuaternion = s.headBase.multiply(headTilt);
      if (s.neck) s.neck.rotationQuaternion = s.neckBase.multiply(neckTilt);
    }

    function toggleHeadTilt() {
      headTiltEnabled = !headTiltEnabled;
      headToggleEl.className = headTiltEnabled ? '' : 'off';
    }
    headToggleEl.addEventListener('click', toggleHeadTilt);
    document.addEventListener('keydown', e => {
      if (e.key === 'h' || e.key === 'H') toggleHeadTilt();
    });

    // ── Build name plates ──────────────────────────────────────────────────────
    const plateMap = {};
    for (const def of sceneData.actors) {
      const div = document.createElement('div');
      div.className = 'plate';
      div.textContent = def.id;
      div.id = `plate-${def.id}`;
      platesEl.appendChild(div);
      plateMap[def.id] = div;
    }

    function setActiveSpeaker(id) {
      for (const [aid, div] of Object.entries(plateMap)) {
        div.className = 'plate' + (aid === id ? ' active' : '');
      }
      // Move spotlight to speaking actor
      const actor = actors[id];
      if (actor) {
        const fp = getFacePos(actor);
        spot.position = new BABYLON.Vector3(fp.x, fp.y + 0.35, fp.z + 0.8);
      }
    }

    // ── Timeline scheduling ────────────────────────────────────────────────────
    let currentAudio = null;
    let currentFaceActor = null;
    const _timers = [];

    function resetFace(actor) {
      if (!actor?.faceAnim) return;
      for (const ch of actor.faceAnim.channels) {
        const mt = actor.morphMap.get(ch.name);
        if (mt) mt.influence = 0;
      }
      actor.faceAnim = null;
    }

    async function playEvent(event) {
      const actor = actors[event.actor];
      if (!actor) return;

      speakerEl.textContent = event.actor.toUpperCase();
      lineEl.textContent    = event.description ?? '';
      setActiveSpeaker(event.actor);

      // Reset previous speaker's face
      if (currentFaceActor && currentFaceActor !== actor) {
        resetFace(currentFaceActor);
      }
      resetFace(actor);

      // Load face JSON
      const faceURL = event.layers?.FACE;
      if (faceURL) {
        const fa = await loadFaceJSON(faceURL);
        if (fa) {
          fa.startT = performance.now() / 1000;
          actor.faceAnim = fa;
          currentFaceActor = actor;
        }
      }

      // Play audio
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (event.audio) {
        const aud = new Audio(event.audio);
        aud.play().catch(e => console.warn('[side] audio:', e));
        currentAudio = aud;
      }

      // Progress bar animation
      const dur = event.duration ?? 3;
      progEl.style.transition = 'none';
      progEl.style.width = '0%';
      requestAnimationFrame(() => {
        progEl.style.transition = `width ${dur}s linear`;
        progEl.style.width = '100%';
      });
    }

    // Schedule all events
    function startTimeline() {
      for (const event of sceneData.timeline) {
        const t = _timers.length;
        _timers.push(setTimeout(() => playEvent(event), event.start * 1000));
      }

      // Clear UI after last event
      const last = sceneData.timeline.at(-1);
      if (last) {
        _timers.push(setTimeout(() => {
          speakerEl.textContent = '';
          lineEl.textContent    = '';
          progEl.style.width    = '0%';
          if (currentAudio) { currentAudio.pause(); currentAudio = null; }
          resetFace(currentFaceActor);
          for (const div of Object.values(plateMap)) div.className = 'plate';
        }, (last.start + last.duration + 1) * 1000));
      }
    }

    // ── Click-to-start ─────────────────────────────────────────────────────────
    loadEl.style.display   = 'none';
    startEl.style.display  = 'flex';

    startEl.addEventListener('click', () => {
      startEl.style.display = 'none';
      startTimeline();
    }, { once: true });

    // ── Render loop ────────────────────────────────────────────────────────────
    engine.runRenderLoop(() => {
      const now = performance.now() / 1000;

      for (const actor of Object.values(actors)) {
        // Face morph tick
        const fa = actor.faceAnim;
        if (fa?.startT) {
          const t = now - fa.startT;
          if (t > fa.duration + 0.1) {
            for (const ch of fa.channels) {
              const mt = actor.morphMap.get(ch.name);
              if (mt) mt.influence = 0;
            }
            actor.faceAnim = null;
          } else {
            for (const ch of fa.channels) {
              const mt = actor.morphMap.get(ch.name);
              if (mt) mt.influence = evalExprChannel(ch, t);
            }
          }
        }

        // Head tilt tick — runs for all actors, settles to rest when disabled
        tickHead(actor, now);
      }

      scene.render();
    });

    window.addEventListener('resize', () => engine.resize());

  </script>
</body>
</html>
